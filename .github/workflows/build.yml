name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Extract or Setup Structure
        run: |
          # Unzip if ZIP file exists
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Extracting ZIP..."
            unzip -o *.zip
          fi

          # If files extracted into a subfolder, move them to root
          if [ -d "JEESaathiTests" ]; then
            cp -r JEESaathiTests/* . 2>/dev/null || true
          fi

          # Create minimal app structure if missing
          mkdir -p app/src/main/java/com/exam/app app/src/main/res/layout app/src/main/res/values

          # Move loose source files into app structure if needed
          mv *.kt app/src/main/java/com/exam/app/ 2>/dev/null || true
          mv *.xml app/src/main/res/layout/ 2>/dev/null || true

          # Create essential build settings if missing
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo 'include(":app")' > settings.gradle.kts
          fi

          # Install gradle and generate Java 17 compatible Wrapper (Version 8.5)
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version=8.5
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk
