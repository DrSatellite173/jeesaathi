      - name: Auto-Extract or Setup Structure
        run: |
          # Unzip if ZIP file exists
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Extracting ZIP..."
            unzip -o *.zip
          fi

          # If files extracted into a subfolder, move them to root
          if [ -d "JEESaathiTests" ]; then
            cp -r JEESaathiTests/* . 2>/dev/null || true
          fi

          # Create minimal app structure if missing
          mkdir -p app/src/main/java/com/exam/app app/src/main/res/layout app/src/main/res/values

          # Move loose source files into app structure if needed
          mv *.kt app/src/main/java/com/exam/app/ 2>/dev/null || true
          mv *.xml app/src/main/res/layout/ 2>/dev/null || true

          # Create essential build settings if missing
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo 'include(":app")' > settings.gradle.kts
          fi

          # Generate Gradle wrapper with version 8.0+ (Java 17 compatible)
          gradle wrapper --gradle-version=8.0
          chmod +x gradlew
