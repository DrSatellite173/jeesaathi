name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP and Fix Structure
        run: |
          # 1. Unzip the archive if present
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Unzipping ZIP file..."
            unzip -o *.zip
          fi

          # 2. If contents are nested inside a folder, bring them out
          if [ -d "JEESaathiTests" ]; then
            cp -r JEESaathiTests/* . 2>/dev/null || true
          fi

          # 3. Create standard Gradle wrapper
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk

